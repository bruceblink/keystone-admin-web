name: Build and publish admin-web release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: admin-web-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release assets require a stable semantic version tag such as v1.0.0" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm test:run
          pnpm typecheck
          pnpm build

      - name: Package production assets
        id: package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          archive="keystone-admin-web-${version}.tar.gz"
          tar -czf "${archive}" -C dist .
          sha256sum "${archive}" > "${archive}.sha256"
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          previous="$(git tag --sort=-version:refname --list 'v*' | grep -v "^${VERSION}$" | head -n 1 || true)"
          {
            echo "keystone-admin-web ${version}"
            if [[ -n "${previous}" ]]; then
              echo "对比范围：${previous}..${VERSION}"
            fi
            echo ""
            echo "🚀 新功能 / Features"
            git log --format='- %s' ${previous:+"${previous}.."}${VERSION} --grep='^feat' || true
            echo ""
            echo "🐛 问题修复 / Bug Fixes"
            git log --format='- %s' ${previous:+"${previous}.."}${VERSION} --grep='^fix' || true
            echo ""
            echo "🧰 维护、文档与测试 / Maintenance, Docs & Tests"
            git log --format='- %s' ${previous:+"${previous}.."}${VERSION} --grep='^\(chore\|docs\|test\|ci\|build\|refactor\)' || true
          } > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "${VERSION}" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            --title "Keystone Admin Web ${VERSION#v}" \
            --notes-file release-notes.md
